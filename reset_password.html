<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - 智能农务系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2d5a27;
            --primary-light: #4a7c42;
            --error-color: #ff4d4f;
            --success-color: #52c41a;
            --warning-color: #faad14;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f7ee 0%, #e4efe1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            background: white;
            border-radius: 20px;
            padding: 40px 45px;
            box-shadow: 0 10px 40px rgba(45, 90, 39, 0.15);
            width: 100%;
            max-width: 440px;
        }

        .reset-icon {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            color: white; font-size: 28px;
        }

        h1 { text-align: center; font-size: 22px; color: var(--primary-color); margin-bottom: 8px; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 30px; }

        /* 步骤指示器 */
        .steps {
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 30px; gap: 12px;
        }
        .step-indicator {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: #999; font-weight: 600;
        }
        .step-indicator.active { color: var(--primary-color); }
        .step-num {
            width: 26px; height: 26px; border-radius: 50%;
            background: #f0f0f0; display: flex; align-items: center; justify-content: center;
            font-size: 12px;
        }
        .step-indicator.active .step-num { background: var(--primary-color); color: white; }
        .step-line { width: 30px; height: 2px; background: #eee; }
        .step-indicator.active + .step-line { background: var(--primary-color); }

        .form-group { margin-bottom: 20px; }

        .form-label {
            display: block; margin-bottom: 8px;
            color: #333; font-weight: 600; font-size: 14px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .email-display {
            font-size: 13px; color: var(--primary-color); font-weight: 600;
            background: #f6ffed; padding: 2px 10px; border-radius: 12px;
        }

        .input-wrap { position: relative; }

        .form-input {
            width: 100%; padding: 14px 16px;
            border: 2px solid #e8e8e8; border-radius: 10px;
            font-size: 15px; transition: all 0.3s; background: #fafafa;
        }
        .form-input:focus {
            outline: none; border-color: var(--primary-color);
            background: #fff; box-shadow: 0 0 0 4px rgba(45, 90, 39, 0.08);
        }
        .form-input.error { border-color: var(--error-color); background: #fff2f0; }

        .toggle-pwd {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            color: #999; cursor: pointer; font-size: 16px; padding: 4px;
        }

        /* 密码强度条 */
        .strength-bar {
            height: 4px; border-radius: 2px; margin-top: 8px;
            background: #f0f0f0; overflow: hidden; display: none;
        }
        .strength-fill {
            height: 100%; width: 0; border-radius: 2px;
            transition: all 0.3s;
        }
        .strength-text {
            font-size: 12px; margin-top: 4px; display: none; text-align: right;
        }

        .send-code-btn {
            width: 100%; padding: 14px;
            background: white; color: var(--primary-color);
            border: 2px solid var(--primary-color); border-radius: 10px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; margin-top: 4px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .send-code-btn:hover:not(:disabled) { background: var(--primary-color); color: white; }
        .send-code-btn:disabled { background: #f5f5f5; border-color: #d9d9d9; color: #999; cursor: not-allowed; }

        .submit-btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white; border: none; border-radius: 10px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; margin-top: 10px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .submit-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(45, 90, 39, 0.35); }
        .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .error-message {
            color: var(--error-color); font-size: 13px; margin-top: 6px;
            min-height: 20px; display: flex; align-items: center; gap: 4px;
        }

        .loading {
            display: inline-block; width: 18px; height: 18px;
            border: 2px solid #ffffff; border-radius: 50%;
            border-top-color: transparent; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .form-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 20px; font-size: 14px;
        }
        .back-link { color: #666; text-decoration: none; }
        .back-link:hover { color: var(--primary-color); }
        .switch-step { color: var(--primary-color); font-weight: 600; cursor: pointer; }
        .switch-step:hover { text-decoration: underline; }

        .success-tip {
            background: #f6ffed; border: 1px solid #b7eb8f;
            color: #389e0d; padding: 12px; border-radius: 8px;
            font-size: 13px; margin-bottom: 20px; display: none; align-items: center; gap: 8px;
        }

        .step-panel { display: none; animation: fadeIn 0.3s; }
        .step-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 480px) {
            .reset-container { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-icon"><i class="fas fa-key"></i></div>
        <h1>找回密码</h1>
        <p class="subtitle">验证身份后重置登录密码</p>

        <!-- 步骤指示器 -->
        <div class="steps">
            <div class="step-indicator active" id="indStep1">
                <div class="step-num">1</div>
                <span>验证邮箱</span>
            </div>
            <div class="step-line"></div>
            <div class="step-indicator" id="indStep2">
                <div class="step-num">2</div>
                <span>重置密码</span>
            </div>
        </div>

        <!-- 成功提示 -->
        <div class="success-tip" id="successTip">
            <i class="fas fa-check-circle"></i>
            <span>验证码已发送，5分钟内有效</span>
        </div>

        <form id="resetForm" onsubmit="return false;">
            <!-- 第一步：发送验证码 -->
            <div class="step-panel active" id="step1">
                <div class="form-group">
                    <label class="form-label">注册邮箱</label>
                    <div class="input-wrap">
                        <input type="email" id="email" class="form-input" placeholder="请输入注册时使用的邮箱" required autofocus>
                    </div>
                    <div class="error-message" id="emailError"></div>
                </div>
                <button type="button" class="send-code-btn" id="sendCodeBtn" onclick="sendCode()">
                    <i class="fas fa-paper-plane"></i> 发送验证码
                </button>
            </div>

            <!-- 第二步：重置密码 -->
            <div class="step-panel" id="step2">
                <div class="form-group">
                    <label class="form-label">
                        <span>验证码</span>
                        <span class="email-display" id="emailDisplay"></span>
                    </label>
                    <div class="input-wrap">
                        <input type="text" id="code" class="form-input" placeholder="请输入6位验证码" maxlength="6" inputmode="numeric">
                    </div>
                    <div class="error-message" id="codeError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">新密码</label>
                    <div class="input-wrap">
                        <input type="password" id="newPassword" class="form-input" placeholder="至少6位字符，建议包含字母和数字" oninput="checkStrength()">
                        <i class="fas fa-eye toggle-pwd" onclick="togglePwd('newPassword', this)"></i>
                    </div>
                    <div class="strength-bar" id="strengthBar"><div class="strength-fill" id="strengthFill"></div></div>
                    <div class="strength-text" id="strengthText"></div>
                    <div class="error-message" id="pwdError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">确认密码</label>
                    <div class="input-wrap">
                        <input type="password" id="confirmPassword" class="form-input" placeholder="再次输入新密码">
                        <i class="fas fa-eye toggle-pwd" onclick="togglePwd('confirmPassword', this)"></i>
                    </div>
                    <div class="error-message" id="confirmError"></div>
                </div>

                <button type="button" class="submit-btn" id="submitBtn" onclick="submitReset()">
                    <i class="fas fa-save"></i> 确认重置
                </button>
            </div>
        </form>

        <div class="form-footer">
            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> 返回登录</a>
            <span class="switch-step hidden" id="changeEmailBtn" onclick="goStep1()">不是这个邮箱？</span>
        </div>
    </div>

    <script>
        let currentEmail = '';
        let countdownTimer = null;

        // 页面加载时从 URL 参数预填邮箱
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const email = params.get('email');
            if (email) {
                document.getElementById('email').value = email;
            }
        });

        // 发送验证码
        async function sendCode() {
            const emailInput = document.getElementById('email');
            const email = emailInput.value.trim();
            const btn = document.getElementById('sendCodeBtn');
            const errEl = document.getElementById('emailError');

            // 前端格式校验
            if (!email) {
                errEl.innerHTML = '<i class="fas fa-exclamation-circle"></i> 请输入邮箱';
                emailInput.classList.add('error');
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                errEl.innerHTML = '<i class="fas fa-exclamation-circle"></i> 邮箱格式不正确';
                emailInput.classList.add('error');
                return;
            }

            errEl.textContent = '';
            emailInput.classList.remove('error');

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>发送中...';

            try {
                const res = await fetch('/api/auth/send-code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: email, purpose: 'reset'})
                }).then(r => r.json());

                if (res.code === 200 || res.code === '200') {
                    currentEmail = email;
                    // 显示成功提示
                    const tip = document.getElementById('successTip');
                    tip.style.display = 'flex';
                    tip.querySelector('span').textContent = `验证码已发送至 ${maskEmail(email)}，5分钟内有效`;
                    setTimeout(() => tip.style.display = 'none', 5000);

                    // 切换到步骤2
                    goStep2();
                    startCountdown(btn, 60);
                } else {
                    throw new Error(res.message || '发送失败');
                }
            } catch (error) {
                errEl.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${error.message}`;
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> 发送验证码';
            }
        }

        // 提交重置
        async function submitReset() {
            const code = document.getElementById('code').value.trim();
            const pwd = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('submitBtn');

            // 校验
            let hasError = false;
            if (!code || code.length !== 6) {
                document.getElementById('codeError').innerHTML = '<i class="fas fa-exclamation-circle"></i> 请输入6位验证码';
                hasError = true;
            } else {
                document.getElementById('codeError').textContent = '';
            }

            if (!pwd || pwd.length < 6) {
                document.getElementById('pwdError').innerHTML = '<i class="fas fa-exclamation-circle"></i> 密码长度至少6位';
                hasError = true;
            } else {
                document.getElementById('pwdError').textContent = '';
            }

            if (pwd !== confirm) {
                document.getElementById('confirmError').innerHTML = '<i class="fas fa-exclamation-circle"></i> 两次密码不一致';
                hasError = true;
            } else {
                document.getElementById('confirmError').textContent = '';
            }

            if (hasError) return;

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>处理中...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: currentEmail,
                        code: code,
                        new_password: pwd
                    })
                }).then(r => r.json());

                if (res.code === 200) {
                    alert('密码重置成功！请使用新密码登录');
                    window.location.href = '/';
                } else {
                    throw new Error(res.message || '重置失败');
                }
            } catch (error) {
                document.getElementById('codeError').innerHTML = `<i class="fas fa-exclamation-circle"></i> ${error.message}`;
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> 确认重置';
            }
        }

        // 步骤切换
        function goStep2() {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('indStep1').classList.remove('active');
            document.getElementById('indStep2').classList.add('active');
            document.getElementById('emailDisplay').textContent = maskEmail(currentEmail);
            document.getElementById('changeEmailBtn').classList.remove('hidden');
            setTimeout(() => document.getElementById('code').focus(), 100);
        }

        function goStep1() {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');
            document.getElementById('indStep2').classList.remove('active');
            document.getElementById('indStep1').classList.add('active');
            document.getElementById('changeEmailBtn').classList.add('hidden');
            document.getElementById('code').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            document.getElementById('codeError').textContent = '';
            document.getElementById('pwdError').textContent = '';
            document.getElementById('confirmError').textContent = '';
        }

        // 倒计时
        function startCountdown(btn, seconds) {
            let remaining = seconds;
            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                remaining--;
                btn.textContent = `${remaining}秒后重试`;
                if (remaining <= 0) {
                    clearInterval(countdownTimer);
                    btn.innerHTML = '<i class="fas fa-redo"></i> 重新发送';
                    btn.disabled = false;
                }
            }, 1000);
        }

        // 密码强度检测
        function checkStrength() {
            const val = document.getElementById('newPassword').value;
            const bar = document.getElementById('strengthBar');
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');

            if (!val) { bar.style.display = 'none'; text.style.display = 'none'; return; }
            bar.style.display = 'block'; text.style.display = 'block';

            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
            if (/\d/.test(val)) score++;
            if (/[^a-zA-Z0-9]/.test(val)) score++;

            const levels = [
                { w: '20%', c: '#ff4d4f', t: '弱：建议增加长度和复杂度' },
                { w: '40%', c: '#ff7875', t: '较弱：建议添加数字或符号' },
                { w: '60%', c: '#faad14', t: '中等：可以更安全' },
                { w: '80%', c: '#52c41a', t: '强：不错的密码' },
                { w: '100%', c: '#237804', t: '很强：非常安全' }
            ];
            const lv = Math.min(score - 1, 4);
            if (score === 0) { fill.style.width = '10%'; fill.style.background = '#ff4d4f'; text.textContent = '太短'; text.style.color = '#ff4d4f'; }
            else {
                fill.style.width = levels[lv].w;
                fill.style.background = levels[lv].c;
                text.textContent = levels[lv].t;
                text.style.color = levels[lv].c;
            }
        }

        // 显示/隐藏密码
        function togglePwd(id, icon) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // 邮箱脱敏
        function maskEmail(email) {
            const [user, domain] = email.split('@');
            const masked = user.length > 3 ? user.slice(0, 2) + '***' + user.slice(-1) : user.slice(0, 1) + '**';
            return masked + '@' + domain;
        }

        // 清理
        window.addEventListener('beforeunload', () => {
            if (countdownTimer) clearInterval(countdownTimer);
        });
    </script>
</body>
</html>
