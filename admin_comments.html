                        'approved': '已通过',
                        'rejected': '已拒绝'
                    };
                    return texts[status] || status;
                };

                const getEmptyIcon = () => {
                    if (searchKeyword.value) return 'fas fa-search';
                    if (currentFilter.value === 'pending') return 'fas fa-check-double';
                    if (currentFilter.value === 'rejected') return 'fas fa-trash-alt';
                    if (currentFilter.value === 'pinned') return 'fas fa-thumbtack';
                    return 'fas fa-inbox';
                };

                const getEmptyTitle = () => {
                    if (searchKeyword.value) return '没有找到匹配的评论';
                    const titles = {
                        'all': '暂无评论',
                        'pending': '暂无待审核评论',
                        'approved': '暂无已通过评论',
                        'rejected': '暂无已拒绝评论',
                        'pinned': '暂无置顶评论'  
                    };
                    return titles[currentFilter.value] || '暂无数据';
                };

                const getEmptyDesc = () => {
                    if (searchKeyword.value) return '请尝试更换关键词或清除筛选条件';
                    return '当有新评论时，会显示在这里';
                };

                const toggleExpand = (comment) => {
                    comment.expanded = !comment.expanded;
                };

                const parseTags = (tags) => {
                    if (!tags) return [];
                    if (Array.isArray(tags)) return tags;
                    return tags.split(',').map(t => t.trim()).filter(t => t);
                };

                // 键盘快捷键
                const handleKeydown = (e) => {
                    if (e.key === 'Escape') {
                        if (previewModal.value.show) closeImageModal();
                        if (deleteModal.value.show) closeDeleteModal();
                    }
                    if (previewModal.value.show) {
                        if (e.key === 'ArrowLeft') changeImage(-1);
                        if (e.key === 'ArrowRight') changeImage(1);
                    }
                };

                // ==================== 生命周期 ====================
                onMounted(() => {
                    fetchCurrentUser();
                    fetchComments();
                    startPolling();
                    window.addEventListener('keydown', handleKeydown);
                });

                onUnmounted(() => {
                    if (pollTimer) clearInterval(pollTimer);
                    window.removeEventListener('keydown', handleKeydown);
                });

                watch([currentFilter, searchKeyword, dateRange], () => {
                    currentPage.value = 1;
                    selectedComments.value = [];
                });

                return {
                    currentUser,
                    isAdmin,
                    permissionChecked,
                    sidebarOpen,
                    loading,
                    globalLoading,
                    error,
                    comments,
                    currentFilter,
                    searchKeyword,
                    dateRange,
                    currentPage,
                    pageSize,
                    selectedComments,
                    stats,
                    previewModal,
                    deleteModal,
                    toasts,
                    filterOptions,
                    filteredComments,
                    paginatedComments,
                    totalPages,
                    isAllSelected,
                    pendingComments,
                    fetchComments,
                    refreshData,
                    setFilter,
                    handleSearch,
                    clearFilters,
                    toggleSelect,
                    toggleSelectAll,
                    clearSelection,
                    batchApprove,
                    batchReject,
                    batchDelete,
                    updateStatus,
                    togglePin,
                    confirmDelete,
                    closeDeleteModal,
                    executeDelete,
                    openImageModal,
                    closeImageModal,
                    changeImage,
                    handleImageError,
                    handleModalImageError,
                    formatTime,
                    formatDate,
                    getStatusIcon,
                    getStatusText,
                    getEmptyIcon,
                    getEmptyTitle,
                    getEmptyDesc,
                    toggleExpand,
                    parseTags,
                    removeToast,
                    goHome
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
