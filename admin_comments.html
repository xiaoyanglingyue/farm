<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评论审核管理 - 智能农务系统</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2d5a27;
            --bg-color: #f0f2f5;
            --sidebar-width: 240px;
            --border-color: #e8e8e8;
            --success-color: #52c41a;
            --warning-color: #faad14;
            --error-color: #ff4d4f;
            --shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            color: #262626;
            overflow-x: hidden;
        }

        /* ==================== 响应式侧边栏（保持原样） ==================== */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--primary-color);
            height: 100vh;
            color: white;
            position: fixed;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 30px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mobile-toggle {
            display: none;
            cursor: pointer;
            font-size: 20px;
        }

        .user-info {
            padding: 15px 20px;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .user-role {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            margin-top: 4px;
            font-weight: bold;
        }

        .role-admin { background: #ff4d4f; color: white; }
        .role-farmer { background: #52c41a; color: white; }

        .nav-menu {
            flex: 1;
            padding: 20px 0;
            overflow-y: auto;
        }

        .nav-item {
            padding: 15px 25px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: 0.3s;
            text-decoration: none;
            color: white;
            position: relative;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.1);
            border-left: 4px solid #fff;
        }

        .nav-item i {
            margin-right: 15px;
            width: 20px;
            text-align: center;
        }

        .badge {
            position: absolute;
            right: 15px;
            background: #ff4d4f;
            color: white;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        /* ==================== 主内容区 ==================== */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 30px;
            max-width: calc(100% - var(--sidebar-width));
            overflow-y: auto;
            height: 100vh;
            transition: margin-left 0.3s;
        }

        .page-header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-title {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ==================== 统计卡片（修复数字显示） ==================== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s;
            min-height: 100px;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .stat-icon.blue { background: #e6f7ff; color: #1890ff; }
        .stat-icon.orange { background: #fff7e6; color: #faad14; }
        .stat-icon.green { background: #f6ffed; color: #52c41a; }
        .stat-icon.red { background: #fff1f0; color: #ff4d4f; }

        .stat-info {
            flex: 1;
            min-width: 0; /* 防止flex子项溢出 */
        }

        .stat-info h3 {
            margin: 0;
            font-size: 28px;
            color: #262626;
            line-height: 1.2;
        }

        .stat-info p {
            margin: 5px 0 0 0;
            color: #8c8c8c;
            font-size: 14px;
        }

        /* ==================== 搜索筛选栏（修复按钮颜色） ==================== */
        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .filter-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* 不同状态按钮的active颜色 */
        .filter-btn.active-all {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .filter-btn.active-pending {
            background: var(--warning-color);
            color: white;
            border-color: var(--warning-color);
        }
        .filter-btn.active-approved {
            background: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }
        .filter-btn.active-rejected {
            background: var(--error-color);
            color: white;
            border-color: var(--error-color);
        }
        .filter-btn.active-pinned {
            background: #d48806;
            color: white;
            border-color: #d48806;
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 0;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(45,90,39,0.1);
        }

        .date-picker {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            min-width: 120px;
        }

        .action-group {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }

        .refresh-btn {
            padding: 8px 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.3s;
            white-space: nowrap;
        }

        .refresh-btn:hover { opacity: 0.9; }
        .refresh-btn.spinning i { animation: spin 1s linear infinite; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* ==================== 批量操作栏 ==================== */
        .batch-bar {
            background: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 15px;
            transform: translateY(-100%);
            opacity: 0;
            transition: all 0.3s;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .batch-bar.show {
            transform: translateY(0);
            opacity: 1;
        }

        .batch-info {
            font-weight: 600;
            color: var(--primary-color);
        }

        .batch-actions {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-success {
            background: #f6ffed;
            color: #389e0d;
            border: 1px solid #b7eb8f;
        }
        .btn-success:hover { background: #389e0d; color: white; }

        .btn-warning {
            background: #fffbe6;
            color: #d48806;
            border: 1px solid #ffe58f;
        }
        .btn-warning:hover { background: #faad14; color: white; }

        .btn-danger {
            background: #fff1f0;
            color: #cf1322;
            border: 1px solid #ffa39e;
        }
        .btn-danger:hover { background: #ff4d4f; color: white; }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }
        .btn-primary:hover { opacity: 0.9; }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
            border: 1px solid #d9d9d9;
        }
        .btn-secondary:hover { background: #e8e8e8; }

        .btn-icon-only { padding: 6px 10px; }

        /* ==================== 表格样式（增强状态标识） ==================== */
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            min-height: calc(100vh - 350px);
            display: flex;
            flex-direction: column;
            min-height: 500px;      /* 确保最小高度占满空间 */
        }

        .data-table {
            width: 100%;
            border-collapse: separate; /* 改为separate以支持左边框 */
            border-spacing: 0;
            font-size: 14px;
            table-layout: fixed;
            flex: 1;
        }

        .data-table th {
            background: #fafafa;
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: #262626;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table th:first-child {
            width: 40px;
            text-align: center;
        }

        .data-table td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
            background: white;
        }

        .data-table tr:hover td {
            background: #fafafa;
        }

        /* 状态行左侧边框标识 */
        .data-table tr.status-pending td:first-child {
            border-left: 4px solid var(--warning-color);
        }
        .data-table tr.status-approved td:first-child {
            border-left: 4px solid var(--success-color);
        }
        .data-table tr.status-rejected td:first-child {
            border-left: 4px solid var(--error-color);
        }

        /* 置顶行特殊背景 */
        .data-table tr.is-pinned td {
            background: #fffbe6 !important;
        }
        .data-table tr.is-pinned:hover td {
            background: #fff3cd !important;
        }
        .data-table tr.is-pinned td:first-child {
            border-left: 4px solid #faad14;
        }

        /* 修复复选框列的左边框显示 */
        .data-table td:first-child {
            border-left: 4px solid transparent;
            transition: border-left-color 0.3s;
        }

        /* 用户信息列 */
        .user-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 180px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), #4a7c42);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
            flex-shrink: 0;
        }

        .user-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-name {
            font-weight: 600;
            color: #262626;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .user-role-tag {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: normal;
        }

        .tag-expert { background: #e6f7ff; color: #1890ff; }
        .tag-farmer { background: #f6ffed; color: var(--primary-color); }

        .user-time {
            font-size: 12px;
            color: #8c8c8c;
        }

        /* 内容列 */
        .content-cell {
            max-width: 300px;
            min-width: 200px;
        }

        .content-text {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.6;
            color: #262626;
            margin-bottom: 8px;
        }

        .content-text.expanded {
            -webkit-line-clamp: unset;
            display: block;
        }

        .expand-btn {
            color: var(--primary-color);
            cursor: pointer;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .expand-btn:hover { text-decoration: underline; }

        .content-images {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .content-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }

        .content-image:hover {
            transform: scale(1.05);
            border-color: var(--primary-color);
        }

        /* 状态列 */
        .status-cell {
            white-space: nowrap;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending-badge { background: #fff7e6; color: #d46b08; }
        .status-approved-badge { background: #f6ffed; color: #389e0d; }
        .status-rejected-badge { background: #fff1f0; color: #cf1322; }
        .status-pinned-badge { background: #fffbe6; color: #d48806; }

        /* 地点标签列 */
        .location-cell {
            color: #8c8c8c;
            font-size: 13px;
            max-width: 150px;
        }

        .location-cell i {
            margin-right: 4px;
            color: var(--primary-color);
        }

        .tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .tag {
            font-size: 11px;
            padding: 2px 6px;
            background: #f0f0f0;
            border-radius: 4px;
            color: #666;
        }

        /* 互动数据列 */
        .stats-cell {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            color: #8c8c8c;
            white-space: nowrap;
            justify-content: center;  /* 新增：垂直居中 */
            height: 100%;
        }

        .stats-cell span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stats-cell i {
            width: 16px;
            text-align: center;
        }

        .data-table tr.status-rejected td,
        .data-table tr.is-pinned td {
            vertical-align: top;
        }

        /* 操作列 */
        .action-cell {
            white-space: nowrap;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* ==================== 分页 ==================== */
        .pagination {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            padding: 20px;
            background: white;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }

        .page-btn {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
        }

        .page-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .page-info {
            color: #666;
            font-size: 13px;
            padding: 0 15px;
        }

        /* ==================== 空状态 ==================== */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #999;
            background: white;
            border-radius: 0 0 12px 12px;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            color: #d9d9d9;
        }

        .empty-state h3 {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* ==================== 图片预览模态框 ==================== */
        .image-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 30px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.3s;
        }

        .modal-close:hover { background: rgba(255,255,255,0.1); }

        .modal-nav {
            position: absolute;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
        }

        .modal-nav:hover { background: rgba(255,255,255,0.2); }
        .modal-nav.prev { left: 20px; }
        .modal-nav.next { right: 20px; }
        .modal-nav:disabled { opacity: 0.3; cursor: not-allowed; }

        .modal-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }

        .modal-counter {
            position: absolute;
            bottom: 30px;
            color: white;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
        }

        /* ==================== 删除确认模态框 ==================== */
        .confirm-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .confirm-modal {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 24px 24px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-icon {
            width: 48px;
            height: 48px;
            background: #fff1f0;
            color: #ff4d4f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }

        .modal-body {
            padding: 16px 24px;
            color: #666;
            line-height: 1.6;
        }

        .modal-footer {
            padding: 16px 24px 24px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* ==================== Toast 提示 ==================== */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 4000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
        }

        .toast {
            background: white;
            padding: 16px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: toastSlideIn 0.3s ease;
            border-left: 4px solid;
        }

        @keyframes toastSlideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast.success { border-left-color: var(--success-color); }
        .toast.error { border-left-color: var(--error-color); }
        .toast.warning { border-left-color: var(--warning-color); }

        .toast-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .toast.success .toast-icon { color: var(--success-color); }
        .toast.error .toast-icon { color: var(--error-color); }
        .toast.warning .toast-icon { color: var(--warning-color); }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .toast-message {
            font-size: 13px;
            color: #666;
        }

        .toast-close {
            color: #999;
            cursor: pointer;
            padding: 4px;
        }

        .toast-close:hover { color: #666; }

        /* ==================== 骨架屏 ==================== */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ==================== 错误状态 ==================== */
        .error-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .error-state i {
            font-size: 48px;
            color: #ff4d4f;
            margin-bottom: 16px;
        }

        .error-state h3 {
            color: #333;
            margin-bottom: 8px;
        }

        .error-state p {
            color: #666;
            margin-bottom: 20px;
        }

        /* ==================== 无权限页面 ==================== */
        .no-permission {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            z-index: 5000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .no-permission i {
            font-size: 80px;
            color: #ff4d4f;
            margin-bottom: 24px;
        }

        .no-permission h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 12px;
        }

        .no-permission p {
            color: #666;
            margin-bottom: 24px;
        }

        /* ==================== 加载遮罩 ==================== */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.7);
            z-index: 3500;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* ==================== 响应式断点 ==================== */
        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }

            /* 表格横向滚动 */
            .table-container {
                overflow-x: auto;
            }

            .data-table {
                min-width: 900px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay.show {
                display: block;
            }
            .main-content {
                margin-left: 0;
                max-width: 100%;
                padding: 20px;
            }
            .mobile-toggle {
                display: block;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .stat-card { padding: 15px; }
            .stat-icon { width: 40px; height: 40px; font-size: 20px; }
            .stat-info h3 { font-size: 22px; }

            .page-header { padding: 15px 20px; }
            .page-title { font-size: 18px; }

            .filter-row { width: 100%; overflow-x: auto; flex-wrap: nowrap; }
            .filter-btn { flex-shrink: 0; }

            .search-box {
                flex-direction: column;
                width: 100%;
            }

            .action-group {
                width: 100%;
                margin-left: 0;
            }

            .refresh-btn {
                width: 100%;
                justify-content: center;
            }

            .batch-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .pagination {
                justify-content: center;
            }
        }

        @media (min-width: 1400px) {
            .main-content {
                padding: 40px;
            }

            .content-cell {
                max-width: 400px;
            }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div id="app">
        <!-- 无权限遮罩 -->
        <div v-if="permissionChecked && !isAdmin" class="no-permission">
            <i class="fas fa-shield-alt"></i>
            <h1>无权访问</h1>
            <p>您没有管理员权限，无法访问评论审核后台</p>
            <button class="btn btn-primary" @click="goHome">
                <i class="fas fa-home"></i> 返回首页
            </button>
        </div>

        <template v-else-if="permissionChecked">
            <!-- 移动端侧边栏遮罩 -->
            <div class="sidebar-overlay" :class="{ show: sidebarOpen }" @click="sidebarOpen = false"></div>

            <!-- 侧边栏 -->
            <aside class="sidebar" :class="{ open: sidebarOpen }">
                <div class="sidebar-header">
                    <span><i class="fas fa-leaf"></i> 智能农务系统</span>
                    <i class="fas fa-times mobile-toggle" @click="sidebarOpen = false"></i>
                </div>

                <div class="user-info" v-if="currentUser">
                    <div style="font-weight: 600; font-size: 14px;">
                        <i class="fas fa-user-circle"></i> {{ currentUser.name || currentUser.email }}
                    </div>
                    <span :class="['user-role', currentUser.role === 'admin' ? 'role-admin' : 'role-farmer']">
                        {{ currentUser.role === 'admin' ? '管理员' : '种植农户' }}
                    </span>
                </div>
                <div class="user-info" v-else style="color: rgba(255,255,255,0.6); font-size: 14px;">
                    <i class="fas fa-spinner fa-spin"></i> 加载中...
                </div>

                <nav class="nav-menu">
                    <a href="/home" class="nav-item">
                        <i class="fas fa-chart-line"></i> 实时监控
                    </a>
                    <a href="/detect" class="nav-item">
                        <i class="fas fa-bug"></i> 病虫害识别
                    </a>

                    <template v-if="currentUser && currentUser.role === 'admin'">
                        <a href="/admin/comments" class="nav-item active">
                            <i class="fas fa-comments"></i> 评论审核
                            <span class="badge" v-if="pendingComments > 0">{{ pendingComments }}</span>
                        </a>
                        <a href="/admin/users" class="nav-item"><i class="fas fa-users-cog"></i> 用户管理</a>
                        <a href="/admin/federated" class="nav-item">
                            <i class="fas fa-network-wired"></i> 联邦学习
                        </a>
                        <a href="/admin/model" class="nav-item">
                            <i class="fas fa-brain"></i> 模型优化
                        </a>
                    </template>

                    <template v-if="currentUser && currentUser.role === 'farmer'">
                        <a href="/comments" class="nav-item">
                            <i class="fas fa-comments"></i> 经验交流
                        </a>
                        <a href="/my-farm" class="nav-item">
                            <i class="fas fa-tractor"></i> 我的农场
                        </a>
                    </template>

                    <a href="/map" class="nav-item">
                        <i class="fas fa-map-marked-alt"></i> 风险地图
                    </a>
                    <a href="/chat" class="nav-item">
                        <i class="fas fa-robot"></i> AI问诊
                    </a>
                    <a href="/knowledge" class="nav-item"><i class="fas fa-book-medical"></i> <span>知识库</span></a>
                    <a href="/farm-records" class="nav-item">
                        <i class="fas fa-history"></i> 农事记录
                    </a>
                    <a href="/set" class="nav-item">
                        <i class="fas fa-cog"></i> 系统设置
                    </a>
                </nav>
            </aside>

            <!-- 主体内容 -->
            <main class="main-content">
                <!-- 页面标题栏 -->
                <div class="page-header">
                    <div class="page-title">
                        <i class="fas fa-bars mobile-toggle" @click="sidebarOpen = true" style="cursor: pointer; color: var(--primary-color);"></i>
                        <i class="fas fa-comments" style="color: var(--primary-color);"></i>
                        评论审核管理
                    </div>
                    <div style="color: #8c8c8c; font-size: 14px;">
                        <i class="fas fa-user-shield"></i> 管理员模式
                    </div>
                </div>

                <!-- 统计卡片（确保数字显示正确） -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon blue">
                            <i class="fas fa-comments"></i>
                        </div>
                        <div class="stat-info">
                            <h3>{{ stats.total || 0 }}</h3>
                            <p>总评论数</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orange">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="stat-info">
                            <h3>{{ stats.pending || 0 }}</h3>
                            <p>待审核</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h3>{{ stats.approved || 0 }}</h3>
                            <p>已通过</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon red">
                            <i class="fas fa-times-circle"></i>
                        </div>
                        <div class="stat-info">
                            <h3>{{ stats.rejected || 0 }}</h3>
                            <p>已拒绝</p>
                        </div>
                    </div>
                </div>

                <!-- 搜索筛选栏（修复按钮颜色逻辑） -->
                <div class="filter-section">
                    <div class="filter-row">
                        <button
                            v-for="filter in filterOptions"
                            :key="filter.value"
                            :class="['filter-btn', currentFilter === filter.value ? `active-${filter.value}` : '']"
                            @click="setFilter(filter.value)"
                        >
                            <i :class="filter.icon" v-if="filter.icon"></i>
                            {{ filter.label }}
                            <span v-if="filter.count !== undefined" style="margin-left: 4px; opacity: 0.8;">({{ filter.count }})</span>
                        </button>
                    </div>

                    <div class="search-box">
                        <input
                            type="text"
                            class="search-input"
                            placeholder="搜索用户、评论内容或地点..."
                            v-model="searchKeyword"
                            @input="handleSearch"
                        >
                        <select class="date-picker" v-model="dateRange" @change="fetchComments">
                            <option value="">全部时间</option>
                            <option value="today">今天</option>
                            <option value="week">最近7天</option>
                            <option value="month">最近30天</option>
                        </select>
                        <div class="action-group">
                            <button class="refresh-btn" :class="{ spinning: loading }" @click="refreshData">
                                <i class="fas fa-sync-alt"></i> 刷新
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 批量操作栏 -->
                <div class="batch-bar" :class="{ show: selectedComments.length > 0 }">
                    <input type="checkbox" :checked="isAllSelected" @change="toggleSelectAll" style="width: 18px; height: 18px; cursor: pointer;">
                    <span class="batch-info">已选择 {{ selectedComments.length }} 条评论</span>
                    <div class="batch-actions">
                        <button class="btn btn-success" @click="batchApprove" :disabled="loading">
                            <i class="fas fa-check"></i> 批量通过
                        </button>
                        <button class="btn btn-warning" @click="batchReject" :disabled="loading">
                            <i class="fas fa-times"></i> 批量拒绝
                        </button>
                        <button class="btn btn-danger" @click="batchDelete" :disabled="loading">
                            <i class="fas fa-trash-alt"></i> 批量删除
                        </button>
                        <button class="btn btn-secondary" @click="clearSelection">
                            <i class="fas fa-times"></i> 取消
                        </button>
                    </div>
                </div>

                <!-- 加载状态 -->
                <div v-if="loading" class="table-container" style="padding: 40px;">
                    <div v-for="n in 5" :key="n" style="display: flex; gap: 16px; margin-bottom: 16px; align-items: center;">
                        <div class="skeleton" style="width: 40px; height: 40px; border-radius: 50%;"></div>
                        <div style="flex: 1;">
                            <div class="skeleton" style="width: 100%; height: 16px; margin-bottom: 8px;"></div>
                            <div class="skeleton" style="width: 60%; height: 12px;"></div>
                        </div>
                    </div>
                </div>

                <!-- 错误状态 -->
                <div v-else-if="error" class="error-state">
                    <i class="fas fa-exclamation-circle"></i>
                    <h3>数据加载失败</h3>
                    <p>{{ error }}</p>
                    <button class="btn btn-primary" @click="fetchComments" style="margin-top: 10px;">
                        <i class="fas fa-redo"></i> 重新加载
                    </button>
                </div>

                <!-- 表格容器 -->
                <div v-else class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>
                                    <input
                                        type="checkbox"
                                        :checked="isAllSelected && paginatedComments.length > 0"
                                        @change="toggleSelectAll"
                                        style="cursor: pointer;"
                                    >
                                </th>
                                <th>用户信息</th>
                                <th>评论内容</th>
                                <th>状态</th>
                                <th>发布时间</th>
                                <th>地点/标签</th>
                                <th>互动数据</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr
                                v-for="comment in paginatedComments"
                                :key="comment.id"
                                :class="[
                                    `status-${comment.status}`,
                                    { 'is-pinned': comment.is_pinned }
                                ]"
                            >
                                <!-- 选择框 -->
                                <td style="text-align: center;">
                                    <input
                                        type="checkbox"
                                        :checked="selectedComments.includes(comment.id)"
                                        @change="toggleSelect(comment.id)"
                                        style="cursor: pointer;"
                                    >
                                </td>

                                <!-- 用户信息 -->
                                <td>
                                    <div class="user-cell">
                                        <div class="avatar">{{ comment.author_name ? comment.author_name[0] : '?' }}</div>
                                        <div class="user-meta">
                                            <div class="user-name">
                                                {{ comment.author_name || comment.user_email || '未知用户' }}
                                                <span :class="['user-role-tag', (comment.role === 'expert' || comment.role === 'admin') ? 'tag-expert' : 'tag-farmer']">
                                                    {{ comment.role === 'admin' ? '管理员' : (comment.role === 'expert' ? '农技专家' : '种植农户') }}
                                                </span>
                                            </div>
                                            <div class="user-time">
                                                <i v-if="comment.is_pinned" class="fas fa-thumbtack" style="color: #faad14; margin-right: 4px;"></i>
                                                {{ formatTime(comment.created_at) }}
                                            </div>
                                        </div>
                                    </div>
                                </td>

                                <!-- 评论内容 -->
                                <td class="content-cell">
                                    <div :class="['content-text', { expanded: comment.expanded }]">
                                        {{ comment.content }}
                                    </div>
                                    <div
                                        v-if="comment.content && comment.content.length > 50"
                                        class="expand-btn"
                                        @click="toggleExpand(comment)"
                                    >
                                        <i :class="comment.expanded ? 'fas fa-chevron-up' : 'fas fa-chevron-down'"></i>
                                        {{ comment.expanded ? '收起' : '展开' }}
                                    </div>

                                    <!-- 图片缩略图 -->
                                    <div class="content-images" v-if="comment.images && comment.images.length">
                                        <img
                                            v-for="(img, index) in comment.images.slice(0, 3)"
                                            :key="index"
                                            :src="img"
                                            class="content-image"
                                            @click="openImageModal(comment.images, index)"
                                            loading="lazy"
                                            @error="handleImageError"
                                        >
                                        <span v-if="comment.images.length > 3" style="display: flex; align-items: center; padding: 0 8px; color: #999; font-size: 12px;">
                                            +{{ comment.images.length - 3 }}
                                        </span>
                                    </div>
                                </td>

                                <!-- 状态 -->
                                <td class="status-cell">
                                    <span :class="['status-badge', `status-${comment.status}-badge`]">
                                        <i :class="getStatusIcon(comment.status)"></i>
                                        {{ getStatusText(comment.status) }}
                                    </span>
                                    <span v-if="comment.is_pinned" class="status-badge status-pinned-badge" style="margin-left: 4px; margin-top: 4px; display: inline-flex;">
                                        <i class="fas fa-thumbtack"></i> 置顶
                                    </span>
                                </td>

                                <!-- 发布时间 -->
                                <td style="white-space: nowrap; color: #8c8c8c; font-size: 13px;">
                                    {{ formatDate(comment.created_at) }}
                                </td>

                                <!-- 地点/标签 -->
                                <td class="location-cell">
                                    <div v-if="comment.location">
                                        <i class="fas fa-map-marker-alt"></i> {{ comment.location }}
                                    </div>
                                    <div class="tags" v-if="comment.tags">
                                        <span v-for="(tag, idx) in parseTags(comment.tags)" :key="idx" class="tag">
                                            {{ tag }}
                                        </span>
                                    </div>
                                    <span v-if="!comment.location && !comment.tags">-</span>
                                </td>

                                <!-- 互动数据 -->
                                <td class="stats-cell">
                                    <span><i class="fas fa-heart" style="color: #ff4d4f;"></i> {{ (comment.likes ?? comment.like_count) || 0 }} 点赞</span>
                                    <span><i class="fas fa-comment-alt" style="color: #1890ff;"></i> {{ (Array.isArray(comment.replies) ? comment.replies.length : (comment.reply_count || 0)) }} 回复</span>
                                    <span><i class="fas fa-eye" style="color: #8c8c8c;"></i> {{ (comment.views ?? comment.view_count) || 0 }} 浏览</span>
                                </td>

                                <!-- 操作按钮 -->
                                <td class="action-cell">
                                    <div class="action-buttons">
                                        <button
                                            v-if="comment.status === 'pending'"
                                            class="btn btn-success"
                                            @click="updateStatus(comment.id, 'approved')"
                                            title="通过"
                                            :disabled="loading"
                                        >
                                            <i class="fas fa-check"></i>
                                        </button>
                                        <button
                                            v-if="comment.status === 'pending'"
                                            class="btn btn-danger"
                                            @click="updateStatus(comment.id, 'rejected')"
                                            title="拒绝"
                                            :disabled="loading"
                                        >
                                            <i class="fas fa-times"></i>
                                        </button>
                                        <button
                                            v-if="comment.status === 'approved' && !comment.is_pinned"
                                            class="btn btn-warning"
                                            @click="togglePin(comment.id, true)"
                                            title="置顶"
                                            :disabled="loading"
                                        >
                                            <i class="fas fa-thumbtack"></i>
                                        </button>
                                        <button
                                            v-if="comment.is_pinned"
                                            class="btn btn-warning"
                                            @click="togglePin(comment.id, false)"
                                            title="取消置顶"
                                            :disabled="loading"
                                        >
                                            <i class="fas fa-thumbtack" style="transform: rotate(45deg);"></i>
                                        </button>
                                        <button
                                            class="btn btn-danger btn-icon-only"
                                            @click="confirmDelete(comment.id)"
                                            title="删除"
                                            :disabled="loading"
                                        >
                                            <i class="fas fa-trash-alt"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- 分页 -->
                    <div class="pagination" v-if="filteredComments.length > 0">
                        <button
                            class="page-btn"
                            :disabled="currentPage === 1 || loading"
                            @click="currentPage--"
                        >
                            <i class="fas fa-chevron-left"></i> 上一页
                        </button>

                        <div class="page-info">
                            第 {{ currentPage }} / {{ totalPages }} 页，共 {{ filteredComments.length }} 条
                        </div>

                        <button
                            class="page-btn"
                            :disabled="currentPage >= totalPages || loading"
                            @click="currentPage++"
                        >
                            下一页 <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>

                    <!-- 空状态 -->
                    <div v-if="filteredComments.length === 0" class="empty-state">
                        <i :class="getEmptyIcon()"></i>
                        <h3>{{ getEmptyTitle() }}</h3>
                        <p>{{ getEmptyDesc() }}</p>
                        <button v-if="searchKeyword || dateRange || currentFilter !== 'all'" class="btn btn-secondary" @click="clearFilters">
                            <i class="fas fa-undo"></i> 清除筛选条件
                        </button>
                    </div>
                </div>
            </main>

            <!-- 全局加载遮罩（用于批量操作） -->
            <div v-if="globalLoading" class="loading-overlay">
                <div class="loading-spinner"></div>
            </div>

            <!-- 图片预览模态框 -->
            <div v-if="previewModal.show" class="image-modal" @click.self="closeImageModal">
                <i class="fas fa-times modal-close" @click="closeImageModal"></i>
                <button
                    class="modal-nav prev"
                    :disabled="previewModal.currentIndex === 0"
                    @click.stop="changeImage(-1)"
                >
                    <i class="fas fa-chevron-left"></i>
                </button>
                <img :src="previewModal.images[previewModal.currentIndex]" class="modal-image" @click.stop @error="handleModalImageError">
                <button
                    class="modal-nav next"
                    :disabled="previewModal.currentIndex >= previewModal.images.length - 1"
                    @click.stop="changeImage(1)"
                >
                    <i class="fas fa-chevron-right"></i>
                </button>
                <div class="modal-counter">{{ previewModal.currentIndex + 1 }} / {{ previewModal.images.length }}</div>
            </div>

            <!-- 删除确认模态框 -->
            <div v-if="deleteModal.show" class="confirm-modal-overlay" @click.self="closeDeleteModal">
                <div class="confirm-modal">
                    <div class="modal-header">
                        <div class="modal-icon">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <h3 class="modal-title">
                            {{ deleteModal.isBatch ? `确认批量删除 ${deleteModal.ids?.length || 0} 条评论？` : '确认删除这条评论？' }}
                        </h3>
                    </div>
                    <div class="modal-body">
                        <p v-if="!deleteModal.isBatch">
                            您即将删除 <strong>{{ deleteModal.commentInfo }}</strong> 的评论<br>
                            <span style="color: #999; font-size: 13px; display: block; margin-top: 8px;">{{ deleteModal.commentPreview }}</span>
                        </p>
                        <p v-else>此操作不可恢复，请谨慎操作。</p>
                        <div style="margin-top: 16px; padding: 12px; background: #fff1f0; border-radius: 6px; color: #cf1322; font-size: 13px;">
                            <i class="fas fa-info-circle"></i> 删除后，该评论的所有回复和点赞记录也将被清除
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" @click="closeDeleteModal">取消</button>
                        <button
                            class="btn btn-danger"
                            :disabled="deleteModal.loading"
                            @click="executeDelete"
                        >
                            <i v-if="deleteModal.loading" class="fas fa-spinner fa-spin"></i>
                            <i v-else class="fas fa-trash-alt"></i>
                            {{ deleteModal.loading ? '删除中...' : '确认删除' }}
                        </button>
                    </div>
                </div>
            </div>

            <!-- Toast 容器 -->
            <div class="toast-container">
                <transition-group name="toast">
                    <div
                        v-for="toast in toasts"
                        :key="toast.id"
                        :class="['toast', toast.type]"
                    >
                        <i :class="['toast-icon', toast.type === 'success' ? 'fas fa-check-circle' : toast.type === 'error' ? 'fas fa-times-circle' : 'fas fa-exclamation-circle']"></i>
                        <div class="toast-content">
                            <div class="toast-title">{{ toast.title }}</div>
                            <div class="toast-message">{{ toast.message }}</div>
                        </div>
                        <i class="fas fa-times toast-close" @click="removeToast(toast.id)"></i>
                    </div>
                </transition-group>
            </div>
        </template>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, onUnmounted, watch } = Vue;

        createApp({
            setup() {
                // ==================== 状态管理 ====================
                const currentUser = ref(null);
                const isAdmin = ref(false);
                const permissionChecked = ref(false);
                const sidebarOpen = ref(false);
                const loading = ref(false);
                const globalLoading = ref(false);
                const error = ref(null);

                // 评论数据
                const comments = ref([]);
                const currentFilter = ref('all');
                const searchKeyword = ref('');
                const dateRange = ref('');
                const currentPage = ref(1);
                const pageSize = ref(10);

                // 选择状态
                const selectedComments = ref([]);

                // 统计
                const stats = ref({ total: 0, pending: 0, approved: 0, rejected: 0, pinned: 0 });
                // 模态框状态
                const previewModal = ref({ show: false, images: [], currentIndex: 0 });
                const deleteModal = ref({ show: false, isBatch: false, ids: [], commentInfo: '', commentPreview: '', loading: false });

                // Toast
                const toasts = ref([]);
                let toastId = 0;

                // 轮询
                let pollTimer = null;

                // ==================== 计算属性 ====================
                const filterOptions = computed(() => [
                    { value: 'all', label: '全部评论', icon: 'fas fa-list', count: stats.value.total },
                    { value: 'pending', label: '待审核', icon: 'fas fa-clock', count: stats.value.pending },
                    { value: 'approved', label: '已通过', icon: 'fas fa-check-circle', count: stats.value.approved },
                    { value: 'rejected', label: '已拒绝', icon: 'fas fa-times-circle', count: stats.value.rejected },
                    { value: 'pinned', label: '置顶精华', icon: 'fas fa-thumbtack', count: stats.value.pinned }
                ]);

                const filteredComments = computed(() => {
                    let result = comments.value;

                    // 状态筛选
                    if (currentFilter.value === 'pinned') {
                        // 置顶精华：显示所有已审核且置顶的评论
                        result = result.filter(c => c.is_pinned && c.status === 'approved');
                    } else if (currentFilter.value !== 'all') {
                        result = result.filter(c => c.status === currentFilter.value);
                    }

                    // 搜索筛选（保持不变）
                    if (searchKeyword.value.trim()) {
                        const keyword = searchKeyword.value.toLowerCase();
                        result = result.filter(c =>
                            (c.author_name || '').toLowerCase().includes(keyword) ||
                            (c.user_email || '').toLowerCase().includes(keyword) ||
                            (c.content || '').toLowerCase().includes(keyword) ||
                            (c.location || '').toLowerCase().includes(keyword)
                        );
                    }

                    // 时间筛选（保持不变）
                    if (dateRange.value) {
                        const now = new Date();
                        result = result.filter(c => {
                            if (!c.created_at) return false;
                            const date = new Date(c.created_at);
                            if (dateRange.value === 'today') {
                                return date.toDateString() === now.toDateString();
                            } else if (dateRange.value === 'week') {
                                const weekAgo = new Date(now - 7 * 24 * 60 * 60 * 1000);
                                return date >= weekAgo;
                            } else if (dateRange.value === 'month') {
                                const monthAgo = new Date(now - 30 * 24 * 60 * 60 * 1000);
                                return date >= monthAgo;
                            }
                            return true;
                        });
                    }

                    return result;
                });

                const paginatedComments = computed(() => {
                    const start = (currentPage.value - 1) * pageSize.value;
                    const end = start + pageSize.value;
                    return filteredComments.value.slice(start, end);
                });

                const totalPages = computed(() => Math.ceil(filteredComments.value.length / pageSize.value));

                const isAllSelected = computed(() => {
                    if (paginatedComments.value.length === 0) return false;
                    return paginatedComments.value.every(c => selectedComments.value.includes(c.id));
                });

                const pendingComments = computed(() => stats.value.pending);

                // ==================== 方法 ====================

                // Toast 提示
                const showToast = (type, title, message, duration = 3000) => {
                    const id = ++toastId;
                    toasts.value.push({ id, type, title, message });
                    setTimeout(() => removeToast(id), duration);
                };

                const removeToast = (id) => {
                    const index = toasts.value.findIndex(t => t.id === id);
                    if (index > -1) toasts.value.splice(index, 1);
                };

                // 权限检查
                const fetchCurrentUser = async () => {
                    try {
                        const response = await fetch('/api/auth/me', {
                            credentials: 'same-origin'  
                        });
                        if (response.ok) {
                            currentUser.value = await response.json();
                            isAdmin.value = currentUser.value?.role === 'admin';
                            if (!isAdmin.value) {
                                permissionChecked.value = true;
                                return;
                            }
                        } else if (response.status === 401) {
                            window.location.href = '/';
                            return;
                        }
                        permissionChecked.value = true;
                    } catch (error) {
                        console.error('获取用户信息失败:', error);
                        showToast('error', '认证错误', '无法验证管理员权限');
                        permissionChecked.value = true;
                    }
                };

                const goHome = () => {
                    window.location.href = '/home';
                };

                // 数据获取
                const fetchComments = async () => {
                    loading.value = true;
                    error.value = null;
                    selectedComments.value = []; // 重置选择

                    try {
                        let url = `/api/comments?limit=200`;

                        // 修复：置顶精华筛选逻辑
                        if (currentFilter.value === 'pinned') {
                            url += `&is_pinned=true`;  // 后端会自动强制 status=approved
                        } else if (currentFilter.value !== 'all') {
                            url += `&status=${currentFilter.value}`;
                        }

                        const response = await fetch(url, {
                            credentials: 'same-origin'
                        });

                        if (response.ok) {
                            const data = await response.json();
                            comments.value = (data.comments || []).map(c => ({ ...c, expanded: false }));

                            // 修复：优先使用后端返回的准确统计
                            if (data.stats && currentUser.value?.role === 'admin') {
                                stats.value = {
                                    total: data.stats.total || 0,
                                    pending: data.stats.pending || 0,
                                    approved: data.stats.approved || 0,
                                    rejected: data.stats.rejected || 0,
                                    pinned: data.stats.pinned || 0
                                };
                            }
                        } else {
                            throw new Error('获取数据失败');
                        }
                    } catch (err) {
                        error.value = err.message;
                        showToast('error', '加载失败', err.message);
                    } finally {
                        loading.value = false;
                    }
                };

                const refreshData = () => {
                    fetchComments();
                    showToast('success', '刷新成功', '数据已更新');
                };

                // 轮询待审核数
                const startPolling = () => {
                    pollTimer = setInterval(async () => {
                        try {
                            const response = await fetch('/api/comments?limit=1&status=pending', {
                                credentials: 'same-origin'  
                            });
                            if (response.ok) {
                                const data = await response.json();
                                if (data.stats && typeof data.stats.pending === 'number') {
                                    stats.value.pending = data.stats.pending;
                                }
                            }
                        } catch (e) {
                            console.error('轮询失败:', e);
                        }
                    }, 30000);
                };

                // 筛选操作
                const setFilter = (filter) => {
                    currentFilter.value = filter;
                    currentPage.value = 1;
                    selectedComments.value = [];
                    fetchComments();
                };

                const handleSearch = () => {
                    currentPage.value = 1;
                };

                const clearFilters = () => {
                    searchKeyword.value = '';
                    dateRange.value = '';
                    currentFilter.value = 'all';
                    currentPage.value = 1;
                    fetchComments();
                };

                // 选择操作
                const toggleSelect = (id) => {
                    const index = selectedComments.value.indexOf(id);
                    if (index > -1) {
                        selectedComments.value.splice(index, 1);
                    } else {
                        selectedComments.value.push(id);
                    }
                };

                const toggleSelectAll = () => {
                    if (isAllSelected.value) {
                        // 取消当前页所有
                        paginatedComments.value.forEach(c => {
                            const idx = selectedComments.value.indexOf(c.id);
                            if (idx > -1) selectedComments.value.splice(idx, 1);
                        });
                    } else {
                        // 选择当前页所有
                        paginatedComments.value.forEach(c => {
                            if (!selectedComments.value.includes(c.id)) {
                                selectedComments.value.push(c.id);
                            }
                        });
                    }
                };

                const clearSelection = () => {
                    selectedComments.value = [];
                };

                // 批量操作
                const batchApprove = async () => {
                    if (selectedComments.value.length === 0) return;
                    globalLoading.value = true;
                    try {
                        const response = await fetch('/api/comments/batch', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'same-origin',
                            body: JSON.stringify({
                                ids: selectedComments.value,
                                action: 'approve'
                            })
                        });
                        const result = await response.json();
                        if (result.code === 200) {
                            showToast('success', '批量通过', `已通过 ${result.success_count} 条评论`);
                            selectedComments.value = [];
                            await fetchComments();
                        } else {
                            throw new Error(result.message || '操作失败');
                        }
                    } catch (err) {
                        showToast('error', '操作失败', err.message);
                    } finally {
                        globalLoading.value = false;
                    }
                };

                const batchReject = async () => {
                    if (selectedComments.value.length === 0) return;
                    globalLoading.value = true;
                    try {
                        // 改为调用批量接口，而非循环单条
                        const response = await fetch('/api/comments/batch', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'same-origin',
                            body: JSON.stringify({
                                ids: selectedComments.value,
                                action: 'reject'  // 使用批量接口
                            })
                        });
                        const result = await response.json();
                        if (result.code === 200) {
                            showToast('success', '批量拒绝', `已拒绝 ${result.success_count} 条评论`);
                            selectedComments.value = [];
                            await fetchComments();
                        } else {
                            throw new Error(result.message || '操作失败');
                        }
                    } catch (err) {
                        showToast('error', '操作失败', err.message);
                    } finally {
                        globalLoading.value = false;
                    }
                };

                const batchDelete = () => {
                    if (selectedComments.value.length === 0) return;
                    deleteModal.value = {
                        show: true,
                        isBatch: true,
                        ids: [...selectedComments.value],
                        loading: false
                    };
                };

                // 单条操作
                const updateStatus = async (id, status) => {
                    loading.value = true;
                    try {
                        const response = await fetch(`/api/comments/${id}/status`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'same-origin',  
                            body: JSON.stringify({ status })
                        });
                        if (response.ok) {
                            showToast('success', '状态更新', `评论已${status === 'approved' ? '通过' : '拒绝'}`);
                            await fetchComments();
                        } else {
                            throw new Error('更新失败');
                        }
                    } catch (err) {
                        showToast('error', '操作失败', err.message);
                    } finally {
                        loading.value = false;
                    }
                };

                const togglePin = async (id, isPinned) => {
                    loading.value = true;
                    try {
                        const response = await fetch(`/api/comments/${id}/status`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'same-origin',
                            body: JSON.stringify({ status: 'approved', is_pinned: isPinned })
                        });
                        if (response.ok) {
                            showToast('success', '置顶更新', isPinned ? '评论已置顶' : '已取消置顶');
                            await fetchComments();
                        } else {
                            throw new Error('操作失败');
                        }
                    } catch (err) {
                        showToast('error', '操作失败', err.message);
                    } finally {
                        loading.value = false;
                    }
                };

               const confirmDelete = (id) => {
                    const comment = comments.value.find(c => c.id === id);
                    deleteModal.value = {
                        show: true,
                        isBatch: false,
                        ids: [id],
                        commentInfo: comment?.author_name || comment?.user_email || '未知用户',
                        commentPreview: comment?.content
                            ? (comment.content.length > 50 ? comment.content.substring(0, 50) + '...' : comment.content)
                            : '无内容',  // ← 改成这样
                        loading: false
                    };
                };

                const closeDeleteModal = () => {
                    deleteModal.value.show = false;
                };

                const executeDelete = async () => {
                    deleteModal.value.loading = true;
                    try {
                        if (deleteModal.value.isBatch) {
                            // 批量删除
                            for (const id of deleteModal.value.ids) {
                                const response = await fetch(`/api/comments/${id}`, {
                                    method: 'DELETE',
                                    credentials: 'same-origin'
                                });
                                if (!response.ok) {
                                    const error = await response.json();
                                    throw new Error(error.error || '删除失败');
                                }
                            }
                            showToast('success', '删除成功', `已删除 ${deleteModal.value.ids.length} 条评论`);
                            selectedComments.value = [];
                        } else {
                            // 单条删除
                            const response = await fetch(`/api/comments/${deleteModal.value.ids[0]}`, {
                                method: 'DELETE',
                                credentials: 'same-origin'
                            });
                            if (!response.ok) {
                                const error = await response.json();
                                throw new Error(error.error || '删除失败');
                            }
                            showToast('success', '删除成功', '评论已删除');
                        }
                        closeDeleteModal();
                        await fetchComments();
                    } catch (err) {
                        showToast('error', '删除失败', err.message);
                    } finally {
                        deleteModal.value.loading = false;
                    }
                };

                // 图片预览
                const openImageModal = (images, index) => {
                    if (!images || images.length === 0) return;
                    previewModal.value = {
                        show: true,
                        images: images,
                        currentIndex: index || 0
                    };
                    document.body.style.overflow = 'hidden';
                };

                const closeImageModal = () => {
                    previewModal.value.show = false;
                    document.body.style.overflow = '';
                };

                const changeImage = (delta) => {
                    const newIndex = previewModal.value.currentIndex + delta;
                    if (newIndex >= 0 && newIndex < previewModal.value.images.length) {
                        previewModal.value.currentIndex = newIndex;
                    }
                };

                const handleImageError = (e) => {
                    e.target.style.display = 'none';
                };

                const handleModalImageError = (e) => {
                    e.target.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iI2Y1ZjVmNSIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPueBmueFi+aWh+ahozwvdGV4dD48L3N2Zz4=';
                };

                // 工具函数
                const formatTime = (timeStr) => {
                    if (!timeStr) return '未知时间';
                    try {
                        const date = new Date(timeStr);
                        const now = new Date();
                        const diff = (now - date) / 1000;

                        if (diff < 60) return '刚刚';
                        if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
                        if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
                        if (diff < 604800) return Math.floor(diff / 86400) + '天前';
                        return date.toLocaleDateString();
                    } catch (e) {
                        return timeStr;
                    }
                };

                const formatDate = (timeStr) => {
                    if (!timeStr) return '-';
                    try {
                        const date = new Date(timeStr);
                        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
                    } catch (e) {
                        return timeStr;
                    }
                };

                const getStatusIcon = (status) => {
                    const icons = {
                        'pending': 'fas fa-clock',
                        'approved': 'fas fa-check',
                        'rejected': 'fas fa-times'
                    };
                    return icons[status] || 'fas fa-question';
                };

                const getStatusText = (status) => {
                    const texts = {
                        'pending': '待审核',
